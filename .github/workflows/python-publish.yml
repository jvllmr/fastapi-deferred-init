name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastapi-deferred-init
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Setup PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.10"
          cache: true
      - name: Install dependencies
        run: pdm install --frozen-lock
      - name: Build
        run: pdm build
      - name: Publish
        run: pdm publish
