name: Benchmark

on:
  push:
    branches: [master]
  merge_group:
    branches: [master]

permissions:
  # deployments permission to deploy GitHub pages website
  deployments: write
  # contents permission to update benchmark contents in gh-pages branch
  contents: write

env:
  PRE_COMMIT_ALLOW_NO_CONFIG: 1

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Setup PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.11"
          cache: true
      - name: Install dependencies
        run: pdm install --frozen-lock
      - name: Run tests
        run: pdm benchmark
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: "pytest"
          output-file-path: benchmark.json
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true
          summary-always: true
          auto-push: true
          gh-pages-branch: pages
