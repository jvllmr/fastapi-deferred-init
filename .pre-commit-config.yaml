repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args:
          - --py311-plus
  - repo: https://github.com/jvllmr/pyaphid
    rev: v0.3.1
    hooks:
      - id: pyaphid
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.17.3"
    hooks:
      - id: ruff
        args:
          - --fix
      - id: ruff-format

  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.74.0
    hooks:
      - id: oxfmt
        types_or: [javascript, jsx, ts, tsx, json, yaml, toml, markdown]
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: pdm run ty check
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # v1.31.1
    hooks:
      - id: zizmor
