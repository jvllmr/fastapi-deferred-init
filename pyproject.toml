[project]
name = "fastapi-deferred-init"
description = "Faster FastAPI start-up time for Projects with many nested routers"
keywords = ["fastapi", "speed", "router", "startup", "optimization"]
authors = [{ name = "Jan Vollmer", email = "jan@vllmr.dev" }]
dependencies = ["fastapi>=0.162.0"]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
  "Environment :: Plugins",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Source = "https://github.com/jvllmr/fastapi-deferred-init"
Changelog = "https://github.com/jvllmr/fastapi-deferred-init/releases"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool]
[tool.pdm]
plugins = ["sync-pre-commit-lock"]

[tool.pdm.scripts]
test = "pytest tests"
full_test = { shell = "pytest tests", env = { FULL_TEST = "true" } }
benchmark = { shell = "pytest tests --benchmark-json benchmark.json", env = { FULL_TEST = "true" } }
post_install = { composite = [
  "prek install",
  "pdm install --plugins --frozen-lock",
  "pip install ./fastapi",
] }


[tool.isort]
profile = "black"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["F"]

[tool.pdm.version]
source = "scm"

[tool.ty.environment]
python-version = "3.11"
python = ".venv"

[tool.ty.src]
include = ["src", "tests"]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<9.2",
  "ruff>=0.17.1",
  "tuna>=0.5.15",
  "pytest-benchmark>=5.3.0",
  "pip>=26.2.1",
  "inline-snapshot>=0.36.1",
  "httpx2>=2.14.0",
  "prek>=0.5.9",
  "ty>=0.0.95",
]
